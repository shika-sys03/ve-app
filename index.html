<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VoiceEye">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>VoiceEye リモート議事録</title>
<style>
  :root {
    --bg: #0f1216;
    --card: #181c23;
    --border: #2a313c;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #38ef7d;
    --danger: #ef4444;
    --blue: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 16px 14px 40px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand img {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(56, 239, 125, 0.25);
    transition: box-shadow 0.2s;
  }
  .brand img.rec-glow {
    box-shadow: 0 0 18px rgba(239, 68, 68, 0.85), 0 0 6px #38ef7d;
  }
  .brand h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .status-pill {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #1f2630;
    color: var(--accent);
    border: 1px solid #2ea04355;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .note-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0d1014;
    color: var(--text);
    font-size: 13px;
    margin-bottom: 12px;
  }
  .rec-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .timer {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
  }
  .timer.rec { color: #ff6b6b; }
  canvas#wave {
    width: 100%;
    max-width: 280px;
    height: 38px;
    background: #11151a;
    border-radius: 8px;
  }
  .btn-row {
    display: flex;
    gap: 10px;
    width: 100%;
  }
  .btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 14px 12px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-rec { background: var(--danger); }
  .btn-stop { background: var(--blue); }
  .btn-file {
    background: #262c36;
    border: 1px solid var(--border);
    font-size: 14px;
  }
  .btn-sm {
    padding: 7px 12px;
    font-size: 12px;
    border-radius: 7px;
    background: #262c36;
    color: var(--text);
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .btn-sm.primary { background: #2f855a; border-color: #2f855a; }
  .progress-box {
    text-align: center;
    padding: 10px;
    font-size: 13px;
    color: #63b3ed;
    display: none;
  }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 8px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    background: #11151a;
    color: var(--muted);
    cursor: pointer;
    border: 1px solid transparent;
  }
  .tab.active {
    background: #222934;
    color: var(--text);
    border-color: var(--border);
  }
  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .result-actions {
    display: flex;
    gap: 6px;
  }
  .content-box {
    background: #0d1014;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 13.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 55vh;
    overflow-y: auto;
  }
  .history-item {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item:active { background: #222934; }
  .history-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .history-time { font-size: 11px; color: var(--muted); }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f2937;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    display: none;
    z-index: 999;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <img id="eyeIcon" src="icon.png" alt="icon">
    <h1>VoiceEye Remote</h1>
  </div>
  <div id="statusBadge" class="status-pill">🟢 PC接続OK</div>
</div>

<div class="card">
  <input id="customNote" class="note-input" type="text" placeholder="補足メモ/会議名（例：〇〇打ち合わせ ※空欄OK）">

  <div class="rec-area">
    <div id="timer" class="timer">00:00</div>
    <canvas id="wave" width="260" height="36"></canvas>

    <div class="btn-row">
      <button id="recBtn" class="btn btn-rec" onclick="toggleRecord()">
        <span>●</span> 録音開始
      </button>
      <input id="micCaptureInput" type="file" accept="audio/*" capture style="display:none" onchange="onFileSelected(event)">
      <label class="btn btn-file">
        📁 音声選択
        <input id="fileInput" type="file" accept="audio/*,video/*,.m4a,.mp3,.wav,.mp4" style="display:none" onchange="onFileSelected(event)">
      </label>
    </div>
  </div>

  <div id="progressBox" class="progress-box">⏳ PCへ送信して文字起こし＆議事録作成中...</div>
</div>

<div class="card">
  <div class="tabs">
    <div id="tabMinutes" class="tab active" onclick="switchTab('minutes')">✨ 議事録・要約</div>
    <div id="tabTranscript" class="tab" onclick="switchTab('transcript')">📝 文字起こし</div>
    <div id="tabHistory" class="tab" onclick="switchTab('history')">📂 履歴一覧</div>
  </div>

  <div id="viewMinutes">
    <div class="result-header">
      <span style="font-size:12px;color:var(--muted)" id="resultTitle">最新の議事録</span>
      <div class="result-actions">
        <button class="btn-sm" onclick="copyText('minutes')">📋 コピー</button>
        <button class="btn-sm primary" onclick="shareText('minutes')">📤 共有</button>
      </div>
    </div>
    <div id="minutesBox" class="content-box">ここに完成した議事録が自動で返ってきます。</div>
  </div>

  <div id="viewTranscript" style="display:none">
    <div class="result-header">
      <span style="font-size:12px;color:var(--muted)">タイムスタンプ付き全文</span>
      <div class="result-actions">
        <button class="btn-sm" onclick="copyText('transcript')">📋 全文コピー</button>
      </div>
    </div>
    <div id="transcriptBox" class="content-box">ここに文字起こし全文が表示されます。</div>
  </div>

  <div id="viewHistory" style="display:none">
    <div id="historyList" class="content-box" style="padding:4px 0;">読み込み中...</div>
  </div>
</div>

<div id="toast" class="toast">✨ 完了しました！</div>

<script>
const GH_REPO = 'shika-sys03/ve-sync-private';
let ghKey = localStorage.getItem('ve_gh_key') || '';
if (location.hash && location.hash.includes('k=')) {
  const m = location.hash.match(/k=([^&]+)/);
  if (m && m[1]) {
    ghKey = decodeURIComponent(m[1]);
    localStorage.setItem('ve_gh_key', ghKey);
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }
}
const isCloudMode = location.hostname.endsWith('github.io') || !!ghKey;
let cloudHistoryCache = [];

function decodeB64Utf8(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function encodeUtf8B64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const res = reader.result || '';
      const idx = res.indexOf(',');
      resolve(idx >= 0 ? res.slice(idx + 1) : res);
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function ghGetJson(path) {
  const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${path}?t=${Date.now()}`, {
    headers: {
      'Authorization': `Bearer ${ghKey}`,
      'Accept': 'application/vnd.github+json'
    },
    cache: 'no-store'
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const meta = await res.json();
  return JSON.parse(decodeB64Utf8(meta.content));
}

async function ghPutJson(path, obj) {
  const b64 = encodeUtf8B64(JSON.stringify(obj));
  const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${path}`, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${ghKey}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: 'mobile job upload',
      content: b64
    })
  });
  if (!res.ok) {
    const errTxt = await res.text();
    throw new Error(`Upload failed (${res.status}): ${errTxt}`);
  }
  return await res.json();
}

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let startTime = 0;
let timerInterval = null;
let audioCtx = null;
let analyser = null;
let animId = null;
let currentJobId = null;

const waveCanvas = document.getElementById('wave');
const ctx = waveCanvas.getContext('2d');
drawIdleWave();

function drawIdleWave() {
  ctx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
  const bars = 16;
  const bw = 10;
  const gap = 6;
  for (let i = 0; i < bars; i++) {
    ctx.fillStyle = '#2a313c';
    ctx.fillRect(10 + i * (bw + gap), waveCanvas.height / 2 - 2, bw, 4);
  }
}

function drawLiveWave() {
  if (!isRecording || !analyser) return;
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  ctx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
  const bars = 16;
  const bw = 10;
  const gap = 6;
  for (let i = 0; i < bars; i++) {
    const val = data[i * 2] / 255.0;
    const h = Math.max(4, val * (waveCanvas.height - 6));
    const y = (waveCanvas.height - h) / 2;
    ctx.fillStyle = val > 0.7 ? '#ff5252' : (val > 0.35 ? '#f6e05e' : '#38ef7d');
    ctx.fillRect(10 + i * (bw + gap), y, bw, h);
  }
  animId = requestAnimationFrame(drawLiveWave);
}

async function toggleRecord() {
  if (!isRecording) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      document.getElementById('micCaptureInput').click();
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;
      source.connect(analyser);

      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        if (audioCtx) audioCtx.close();
        const mime = mediaRecorder.mimeType || 'audio/webm';
        const ext = mime.includes('mp4') || mime.includes('aac') ? '.m4a' : '.webm';
        const blob = new Blob(audioChunks, { type: mime });
        uploadAudio(blob, 'mobile_rec' + ext);
      };

      mediaRecorder.start();
      isRecording = true;
      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 250);
      drawLiveWave();

      const btn = document.getElementById('recBtn');
      btn.className = 'btn btn-stop';
      btn.innerHTML = '<span>■</span> 停止＆作成';
      document.getElementById('timer').classList.add('rec');
      document.getElementById('eyeIcon').classList.add('rec-glow');
      document.getElementById('statusBadge').textContent = '🔴 録音中...';
    } catch (err) {
      document.getElementById('micCaptureInput').click();
    }
  } else {
    isRecording = false;
    clearInterval(timerInterval);
    if (animId) cancelAnimationFrame(animId);
    drawIdleWave();
    mediaRecorder.stop();

    const btn = document.getElementById('recBtn');
    btn.className = 'btn btn-rec';
    btn.innerHTML = '<span>●</span> 録音開始';
    document.getElementById('timer').classList.remove('rec');
    document.getElementById('eyeIcon').classList.remove('rec-glow');
  }
}

function updateTimer() {
  const sec = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}

function onFileSelected(e) {
  const file = e.target.files[0];
  if (!file) return;
  uploadAudio(file, file.name);
  e.target.value = '';
}

async function uploadAudio(blob, filename) {
  const pBox = document.getElementById('progressBox');
  pBox.style.display = 'block';
  pBox.textContent = '📤 PCへ音声データを送信中...';
  document.getElementById('statusBadge').textContent = '⏳ 送信中';

  const note = document.getElementById('customNote').value || '';
  try {
    if (isCloudMode) {
      const audio_b64 = await blobToBase64(blob);
      const jobId = 'job_' + Date.now();
      await ghPutJson(`jobs/${jobId}.json`, {
        job_id: jobId,
        filename: filename,
        note: note,
        audio_b64: audio_b64,
        ts: Date.now()
      });
      pBox.textContent = '⏳ PCで受信待機・文字起こし中...';
      document.getElementById('statusBadge').textContent = '⏳ 処理中';
      currentJobId = jobId;
      pollStatus(currentJobId);
    } else {
      const res = await fetch('/api/upload?filename=' + encodeURIComponent(filename) + '&note=' + encodeURIComponent(note), {
        method: 'POST',
        body: blob
      });
      const data = await res.json();
      if (!data.job_id) throw new Error(data.error || 'Upload failed');
      currentJobId = data.job_id;
      pollStatus(currentJobId);
    }
  } catch (err) {
    pBox.textContent = '❌ 送信エラー: ' + err.message;
    document.getElementById('statusBadge').textContent = '⚠️ エラー';
  }
}

async function pollStatus(jobId) {
  const pBox = document.getElementById('progressBox');
  const timer = setInterval(async () => {
    try {
      let data = null;
      if (isCloudMode) {
        data = await ghGetJson(`status/${jobId}.json`);
      } else {
        const res = await fetch('/api/status?job_id=' + encodeURIComponent(jobId));
        data = await res.json();
      }
      if (!data) return;
      pBox.textContent = data.progress || '⏳ PCで処理中...';
      if (data.TranscriptPartial) {
        document.getElementById('transcriptBox').textContent = data.TranscriptPartial;
      }
      if (data.status === 'done') {
        clearInterval(timer);
        pBox.style.display = 'none';
        document.getElementById('minutesBox').textContent = data.minutes || '';
        document.getElementById('transcriptBox').textContent = data.transcript || '';
        document.getElementById('statusBadge').textContent = '🟢 完了!';
        switchTab('minutes');
        showToast('✨ 議事録が完成しました！');
      } else if (data.status === 'error') {
        clearInterval(timer);
        pBox.textContent = '❌ エラー: ' + (data.error || '');
        document.getElementById('statusBadge').textContent = '⚠️ エラー';
      }
    } catch (e) {}
  }, 2000);
}

function switchTab(tab) {
  document.getElementById('tabMinutes').classList.toggle('active', tab === 'minutes');
  document.getElementById('tabTranscript').classList.toggle('active', tab === 'transcript');
  document.getElementById('tabHistory').classList.toggle('active', tab === 'history');

  document.getElementById('viewMinutes').style.display = tab === 'minutes' ? 'block' : 'none';
  document.getElementById('viewTranscript').style.display = tab === 'transcript' ? 'block' : 'none';
  document.getElementById('viewHistory').style.display = tab === 'history' ? 'block' : 'none';

  if (tab === 'history') loadHistory();
}

async function loadHistory() {
  const box = document.getElementById('historyList');
  try {
    if (isCloudMode) {
      const data = await ghGetJson('latest.json');
      cloudHistoryCache = data.items || [];
      if (cloudHistoryCache.length === 0) {
        box.innerHTML = '<div style="padding:12px;color:var(--muted)">まだ保存された議事録がありません。</div>';
        return;
      }
      box.innerHTML = cloudHistoryCache.map((item, idx) => `
        <div class="history-item" onclick="openCloudHistoryItem(${idx})">
          <div class="history-title">📄 ${item.title}</div>
          <div class="history-time">${item.time}</div>
        </div>
      `).join('');
      return;
    }
    const res = await fetch('/api/history');
    const data = await res.json();
    if (!data.items || data.items.length === 0) {
      box.innerHTML = '<div style="padding:12px;color:var(--muted)">まだ保存された議事録がありません。</div>';
      return;
    }
    box.innerHTML = data.items.map(item => `
      <div class="history-item" onclick="openHistoryItem('${item.filename}')">
        <div class="history-title">📄 ${item.title}</div>
        <div class="history-time">${item.time}</div>
      </div>
    `).join('');
  } catch (e) {
    box.innerHTML = '<div style="padding:12px;color:var(--danger)">履歴の取得に失敗しました。</div>';
  }
}

function openCloudHistoryItem(idx) {
  const item = cloudHistoryCache[idx];
  if (!item) return;
  document.getElementById('minutesBox').textContent = item.content || '';
  document.getElementById('resultTitle').textContent = item.filename;
  switchTab('minutes');
}

async function openHistoryItem(filename) {
  try {
    const res = await fetch('/api/history_item?file=' + encodeURIComponent(filename));
    const data = await res.json();
    document.getElementById('minutesBox').textContent = data.content || '';
    document.getElementById('resultTitle').textContent = filename;
    switchTab('minutes');
  } catch (e) {}
}

function copyText(type) {
  const text = document.getElementById(type === 'minutes' ? 'minutesBox' : 'transcriptBox').textContent;
  navigator.clipboard.writeText(text).then(() => showToast('📋 コピーしました！'));
}

function shareText(type) {
  const text = document.getElementById(type === 'minutes' ? 'minutesBox' : 'transcriptBox').textContent;
  if (navigator.share) {
    navigator.share({ title: '議事録', text: text }).catch(() => {});
  } else {
    copyText(type);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

// 初回ロード時に最新の議事録があれば読み込む
(async () => {
  try {
    if (isCloudMode) {
      const data = await ghGetJson('latest.json');
      if (data.minutes) document.getElementById('minutesBox').textContent = data.minutes;
      if (data.transcript) document.getElementById('transcriptBox').textContent = data.transcript;
      cloudHistoryCache = data.items || [];
    } else {
      const res = await fetch('/api/latest');
      const data = await res.json();
      if (data.minutes) document.getElementById('minutesBox').textContent = data.minutes;
      if (data.transcript) document.getElementById('transcriptBox').textContent = data.transcript;
    }
  } catch (e) {}
})();
</script>
</body>
</html>
